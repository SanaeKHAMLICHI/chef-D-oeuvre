<div class="container mx-auto sm:px-4 sm:py-2  items-center w-4/5 ">
  <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="flex flex-col sm:gap-6">
    <!-- Section upload de photos -->
    <div class="bg-card  sm:rounded-2xl sm:p-8 px-4 sm:shadow-md flex flex-col sm:gap-6 gap-3">
      <h2 class="">Ajouter vos photos:</h2>

      <!-- Zone d'upload et preview -->
      <div class="flex gap-6 sm:gap-10 flex-wrap">
        <!-- Bouton d'ajout (toujours à gauche) -->
        <label class="w-32 h-32 sm:w-48 sm:h-48 bg-[#9FCD9F] rounded-xl cursor-pointer flex flex-col items-center justify-center" for="photo-upload">
          <span class="text-4xl text-custom-green-dark mb-2">+</span>
          <span class="text-custom-green-dark text-center">Ajouter vos photos</span>
          <input
            type="file"
            id="photo-upload"
            class="hidden"
            accept="image/*"
            multiple
            (change)="onFileSelected($event)"
          >
        </label>
        <!-- Images sélectionnées (à droite) -->
        <div *ngFor="let image of selectedImages; let i = index" class="relative w-32 h-32 sm:w-48 sm:h-48">
          <img [src]="image.preview"
               alt="Preview"
               class="w-full h-full object-cover rounded-xl">
          <button
            type="button"
            (click)="removeImage(i)"
            class="absolute top-2 right-2 text-custom-green-darkw-6 h-6 flex items-center justify-center text-2xl font-bold">
            ×
          </button>
        </div>
        <!-- Message d'erreur sous le label -->

      </div>
      <div *ngIf="fileSizeErrorMessage" class="text-red-500 text-sm w-full -mt-5">
        {{ fileSizeErrorMessage }}
      </div>
      <!-- Champs titre et description -->
      <div class="">
        <label class="block font-medium mb-2">Titre:</label>
        <input
          type="text"
          formControlName="title"
          class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-custom-green-light"
          [class.border-red-500]="isFieldInvalid('title')"
        >
        <div *ngIf="isFieldInvalid('title')" class="text-red-500 text-sm mt-1">
          {{ getErrorMessage('title') }}
        </div>
      </div>

      <div class="">
        <label class="block font-medium mb-2">Description:</label>
        <textarea
          formControlName="description"
          class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-custom-green-light sm:min-h-[120px] resize-y"
          [class.border-red-500]="isFieldInvalid('description')"
        ></textarea>
        <div *ngIf="isFieldInvalid('description')" class="text-red-500 text-sm mt-1">
          {{ getErrorMessage('description') }}
        </div>
      </div>
    </div>

    <!-- Section critères -->
    <div class="bg-card sm:rounded-2xl sm:p-8 sm:shadow-md flex flex-col gap-3 p-4">
      <div>
        <select
          formControlName="category"
          class=" px-4 py-2 border border-gray-200 rounded-lg  cursor-pointer w-52 select-custom"
          [class.border-red-500]="isFieldInvalid('category')"
        >
          <option value="" disabled>Catégorie</option>
          <option *ngFor="let category of categories$()" [value]="category.id">
            {{ category.name }}
          </option>
        </select>
        <div *ngIf="isFieldInvalid('category')" class="text-red-500 text-sm mt-1">
          {{ getErrorMessage('category') }}
        </div>
      </div>
      <div>
        <label class="block font-medium mb-2">Code postal:</label>
        <input
          formControlName="postalCode"
          type="text"
          class="px-4 py-2 border border-gray-200 rounded-lg w-52"
          placeholder="Code postal"
          [class.border-red-500]="isFieldInvalid('postalCode')"
          pattern="[0-9]*"
          inputmode="numeric"
          maxlength="5"
        />
        <div *ngIf="isFieldInvalid('postalCode')" class="text-red-500 text-sm mt-1">
          {{ getErrorMessage('postalCode') }}
        </div>
      </div>

      <div class="flex flex-col gap-4 border-0 sm:border sm:border-gray-200 rounded-lg md:p-2 sm:p-6">
        <span class="font-medium text-body-color">Critères</span>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <select [class.border-red-500]="isFieldInvalid('state')"
            formControlName="state" class="w-full sm:w-48 px-2 sm:px-4 py-2 pr-8 bg-select text-custom-green-dark rounded-lg select-custom">
              <option value="" disabled selected>État</option>
              <option *ngFor="let state of states" [value]="state.value">
                {{ state.label }}
              </option>
            </select>
            <div *ngIf="isFieldInvalid('state')" class="text-red-500 text-sm mt-1">
              {{ getErrorMessage('state') }}
            </div>
          </div>

          <div>
            <select
              [class.border-red-500]="isFieldInvalid('state')"
              formControlName="color" class="w-full sm:w-48 px-2 sm:px-4 py-2 pr-8 bg-select text-custom-green-dark rounded-lg select-custom">
              <option value="" disabled selected>Couleur</option>
              <option *ngFor="let color of colors" [value]="color.value">
                {{ color.label }}
              </option>
            </select>
            <div *ngIf="isFieldInvalid('color')" class="text-red-500 text-sm mt-1">
              {{ getErrorMessage('color') }}
            </div>
          </div>

          <div>
            <select formControlName="material"
                    [class.border-red-500]="isFieldInvalid('state')"

            class="w-full sm:w-48 px-2 sm:px-4 py-2 pr-8 bg-select text-custom-green-dark rounded-lg select-custom">
              <option value="" disabled selected>Matière</option>
              <option *ngFor="let material of materials" [value]="material.value">
                {{ material.label }}
              </option>
            </select>
            <div *ngIf="isFieldInvalid('material')" class="text-red-500 text-sm mt-1">
              {{ getErrorMessage('material') }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="sm:mt-6 flex justify-center">
      <app-button
        type="submit"
        [label]="announcement ? 'Modifier' : 'Ajouter'"
        class="w-full sm:w-48 px-4"
        >
      </app-button>
    </div>

  </form>
</div>

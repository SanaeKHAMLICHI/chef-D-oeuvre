<ng-container class="flex">
  @if(announcement){
    <div class="flex flex-col px-3 md:px-0 md:w-[70%] m-auto rounded-2xl md:py-5 gap-8">

      <!-- Carousel (Garde Web, Réorganise Mobile) -->
      <div class="relative w-full">
        <!-- Icône Favoris -->
        <img [src]="isFavorite ? 'assets/favoris-filled.svg' : 'assets/favoris.svg'"
             alt="favorite icon"
             width="50" height="50"
             class="absolute top-4 right-4 z-10 p-3 bg-white rounded-2xl shadow"
             (click)="toggleFavorite()"
        />

        <!-- Carousel -->
        <div class="carousel flex justify-center w-full">
          <div class="carousel-container flex justify-start w-full mx-auto">
            <div class="carousel flex gap-1 overflow-x-auto snap-x snap-mandatory rounded-2xl h-80">
              <div *ngFor="let img of announcement.files" class="carousel-item flex-shrink-0 snap-start w-full md:w-1/2">
                <img [src]="'http://localhost:9001/greenswap/' + img"
                     alt="Carousel image"
                     class="object-cover w-full h-auto" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Fin Carousel -->

      <!-- Contenu Principal -->
      <div class="flex flex-col md:flex-row gap-6 md:gap-10">

        <!-- Section de Gauche (Contact & Critères) -->
        <div class="flex  md:flex-col flex-col-reverse gap-5 w-full md:w-1/3 order-2 md:order-none">
          <app-contact [announcement]="announcement"/>
          <app-criteria [announcement]="announcement"/>
        </div>

        <!-- Section de Droite (Titre, Localisation, Description) -->
        <div class="flex flex-col gap-3 md:gap-5 w-full md:w-2/3 order-1 md:order-none">

          <!-- Titre -->
          <div class="flex justify-between font-bold  text-lg md:text-3xl">
            {{ announcement.title }}
          </div>

          <!-- Localisation -->
          <div class="flex flex-col gap-3">
            <div class="flex gap-2">
              <img ngSrc="/assets/icons/localisation.svg" alt="location icon" width="20" height="20"/>
              <p class="">{{ announcement.postalCode }}</p>
            </div>
            <p class="text-gray-500">{{ announcement.createdAt | customDatePipe: 'dd/MM/yyyy' }}</p>
          </div>

          <!-- Description -->
          <div class="flex flex-col gap-3 md:gap-6">
            <div class="font-bold text-lg md:text-xl">Description</div>
            <div>{{ announcement.description }}</div>
          </div>

        </div>
      </div>

    </div>
  }
</ng-container>

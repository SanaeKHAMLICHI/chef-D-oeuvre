<div class="fixed top-4 right-4 z-50 space-y-3 w-80">
  <div
    *ngFor="let notif of notifications$ | async"
    class="px-4 py-3 rounded shadow-md  animate-fade-in-out"
    [ngClass]="{
      'bg-[#9FCD9F], text-black': notif.type === 'success',
      'bg-red-600 , text-white': notif.type === 'error',
      'bg-yellow-500, text-white': notif.type === 'warning',
      'bg-blue-600, text-white': notif.type === 'info'

    }"
  >
    {{ notif.message }}
  </div>
</div>
